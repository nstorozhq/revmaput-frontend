server {
    listen 80;
    listen [::]:80;
    server_name medicina.storozhq.ru;

    root /var/www/medicina.storozhq.ru/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/medicina-acme;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
        root /var/www/medicina.storozhq.ru/shared;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
