server {
    listen 80;
    listen [::]:80;
    server_name medicina.storozhq.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/medicina-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://medicina.storozhq.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name medicina.storozhq.ru;

    ssl_certificate /etc/letsencrypt/live/medicina.storozhq.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medicina.storozhq.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/medicina.storozhq.ru/current;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
        root /var/www/medicina.storozhq.ru/shared;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
